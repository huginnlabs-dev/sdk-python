[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huginnlabs-dataflow"
version = "0.6.0"
description = "HuginnLabs Dataflow SDK for Python — runtime tracing streamed to the Dataflow SaaS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "grpcio>=1.66",
    "protobuf>=5.26",
    "cryptography>=42",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["dataflow", "dataflow.proto_gen"]
